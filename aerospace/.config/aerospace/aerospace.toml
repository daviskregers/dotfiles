# Place a copy of this config to ~/.aerospace.toml
# After that, you can edit ~/.aerospace.toml to your liking

# Feel free to omit keys that you don't use in your config.
# If the key is absent in your config the default value is taken from this config

# You can use it to add commands that run after login to macOS user session.
# 'start-at-login' needs to be 'true' for 'after-login-command' to work
# Available commands: https://nikitabobko.github.io/AeroSpace/commands.html
after-login-command = []

# You can use it to add commands that run after AeroSpace startup.
# 'after-startup-command' is run after 'after-login-command'
# Available commands : https://nikitabobko.github.io/AeroSpace/commands.html
after-startup-command = []

# Start AeroSpace at login
start-at-login = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide.html#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide.html#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 30

# Possible values: tiles|accordion
default-root-container-layout = 'accordion'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See: https://nikitabobko.github.io/AeroSpace/guide.html#assign-workspaces-to-monitors
gaps.inner.horizontal = 0
gaps.inner.vertical =   0
gaps.outer.left =       0
gaps.outer.bottom =     0
gaps.outer.top =        0
gaps.outer.right =      0

# Visual indent makes it easier to understand that containers of the same orientation are nested.
# If you have 'enable-normalization-opposite-orientation-for-nested-containers' enabled then
# there is no way to observe the indent
# indent-for-nested-containers-with-the-same-orientation = 30

# 'main' binding mode declaration
# See: https://nikitabobko.github.io/AeroSpace/guide.html#binding-modes
# 'main' binding mode must be always presented
[mode.main.binding]

# All possible keys:
# - Letters.        a, b, c, ..., z
# - Numbers.        0, 1, 2, ..., 9
# - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
# - F-keys.         f1, f2, ..., f20
# - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon, backtick,
#                   leftSquareBracket, rightSquareBracket, space, enter, esc, backspace, tab
# - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
#                   keypadMinus, keypadMultiply, keypadPlus
# - Arrows.         left, down, up, right

# All possible modifiers: cmd, alt, ctrl, shift
# ctrl-alt-cmd is sent by Karabiner for fn+<key> (see karabiner/), keeping alt free for tmux/emacs.

# All possible commands: https://nikitabobko.github.io/AeroSpace/commands.html

# You can uncomment this line to open up terminal with alt + enter shortcut
# See: https://nikitabobko.github.io/AeroSpace/commands.html#exec-and-forget
# alt-enter = 'exec-and-forget open -n /System/Applications/Utilities/Terminal.app'

ctrl-alt-cmd-shift-p = 'exec-and-forget open -n /Applications/1Password.app'
ctrl-alt-cmd-shift-enter = 'exec-and-forget open -n /Applications/WezTerm.app'
#alt-shift-f = 'exec-and-forget open -n ~'

# See: https://nikitabobko.github.io/AeroSpace/commands.html#layout
ctrl-alt-cmd-slash = 'layout tiles horizontal vertical'
ctrl-alt-cmd-comma = 'layout accordion horizontal vertical'

# See: https://nikitabobko.github.io/AeroSpace/commands.html#focus
ctrl-alt-cmd-h = 'focus left'
ctrl-alt-cmd-j = 'focus down'
ctrl-alt-cmd-k = 'focus up'
ctrl-alt-cmd-l = 'focus right'

# See: https://nikitabobko.github.io/AeroSpace/commands.html#move
ctrl-alt-cmd-shift-h = 'move left'
ctrl-alt-cmd-shift-j = 'move down'
ctrl-alt-cmd-shift-k = 'move up'
ctrl-alt-cmd-shift-l = 'move right'

# See: https://nikitabobko.github.io/AeroSpace/commands.html#resize
ctrl-alt-cmd-shift-minus = 'resize smart -50'
ctrl-alt-cmd-shift-equal = 'resize smart +50'

# See: https://nikitabobko.github.io/AeroSpace/commands.html#workspace
ctrl-alt-cmd-a = 'workspace dev'
ctrl-alt-cmd-s = 'workspace dev-2'
ctrl-alt-cmd-d = 'workspace dev-3'
ctrl-alt-cmd-f = 'workspace http'
ctrl-alt-cmd-w = 'workspace www'
ctrl-alt-cmd-e = 'workspace www2'
ctrl-alt-cmd-z = 'workspace todo'
ctrl-alt-cmd-x = 'workspace db'
ctrl-alt-cmd-c = 'workspace comms'
ctrl-alt-cmd-v = 'workspace 7'
ctrl-alt-cmd-b = 'workspace 8'
ctrl-alt-cmd-n = 'workspace notes'
ctrl-alt-cmd-m = 'workspace music'

# See: https://nikitabobko.github.io/AeroSpace/commands.html#move-node-to-workspace
ctrl-alt-cmd-shift-a = 'move-node-to-workspace dev'
ctrl-alt-cmd-shift-s = 'move-node-to-workspace dev-2'
ctrl-alt-cmd-shift-d = 'move-node-to-workspace dev-3'
ctrl-alt-cmd-shift-f = 'move-node-to-workspace http'
ctrl-alt-cmd-shift-w = 'move-node-to-workspace www'
ctrl-alt-cmd-shift-e = 'move-node-to-workspace www2'
ctrl-alt-cmd-shift-z = 'move-node-to-workspace todo'
ctrl-alt-cmd-shift-x = 'move-node-to-workspace db'
ctrl-alt-cmd-shift-c = 'move-node-to-workspace comms'
ctrl-alt-cmd-shift-v = 'move-node-to-workspace 7'
ctrl-alt-cmd-shift-b = 'move-node-to-workspace 8'
ctrl-alt-cmd-shift-n = 'move-node-to-workspace notes'
ctrl-alt-cmd-shift-m = 'move-node-to-workspace music'

# See: https://nikitabobko.github.io/AeroSpace/commands.html#workspace-back-and-forth
ctrl-alt-cmd-tab = 'workspace-back-and-forth'
# See: https://nikitabobko.github.io/AeroSpace/commands.html#move-workspace-to-monitor
ctrl-alt-cmd-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# See: https://nikitabobko.github.io/AeroSpace/commands.html#mode
ctrl-alt-cmd-shift-semicolon = 'mode service'
ctrl-alt-cmd-shift-slash = 'mode join'

# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide.html#binding-modes
[mode.service.binding]
r = ['flatten-workspace-tree', 'mode main'] # reset layout
#s = ['layout sticky tiling', 'mode main'] # sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
backspace = ['close-all-windows-but-current', 'mode main']
esc = ['reload-config', 'mode main']

# 'join' binding mode declaration
# See: https://nikitabobko.github.io/AeroSpace/guide.html#binding-modes
[mode.join.binding]
ctrl-alt-cmd-shift-h = ['join-with left', 'mode main']
ctrl-alt-cmd-shift-j = ['join-with down', 'mode main']
ctrl-alt-cmd-shift-k = ['join-with up', 'mode main']
ctrl-alt-cmd-shift-l = ['join-with right', 'mode main']
esc = 'mode main'

