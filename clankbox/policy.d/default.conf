# clankbox default network allowlist.
# Applied with `clankbox policy` -> `sbx policy allow network`.
# One host per line. Supports exact (example.com), wildcard (*.example.com),
# and port suffix (example.com:443). '#' starts a comment.
#
# This is the practical default: it must include the registries the agent needs
# to build and test, or every session drowns in denials. Those registries are the
# accepted supply-chain surface — the real protection is that no cloud/SSH creds
# live in the box. Grow this list from what `clankbox log` shows you dropped.
# Host model endpoints (ollama/lmstudio) are NOT here — they are per-machine, set
# via CLANKBOX_HOST_MODELS in ~/.config/clankbox/config.

# --- agent APIs + subscription login (OAuth) ---
# claude code's OAuth uses the claude.com domain (platform.claude.com); the API is
# on anthropic.com. Both required for a subscription /login to complete.
api.anthropic.com
*.anthropic.com
claude.com
*.claude.com
claude.ai
*.claude.ai
statsig.anthropic.com
api.githubcopilot.com
*.githubcopilot.com
api.openai.com
opencode.ai
*.opencode.ai

# --- package registries ---
registry.npmjs.org
*.npmjs.org
pypi.org
files.pythonhosted.org
crates.io
static.crates.io
proxy.golang.org
sum.golang.org
repo.hex.pm
luarocks.org

# --- container image registries ---
# Docker Hub: index/auth on *.docker.io, but image BLOBS come from CloudFront
# (production.cloudfront.docker.com) — both are required or pulls 403.
registry-1.docker.io
auth.docker.io
index.docker.io
*.docker.io
production.cloudfront.docker.com
*.cloudfront.docker.com
ghcr.io
pkg-containers.githubusercontent.com
*.githubusercontent.com

# --- source / git ---
github.com
*.github.com
codeload.github.com
